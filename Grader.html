<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grader</title>
<style>
:root{--bg:#e4e4e4;--panel:#f3f3f3;--line:#b5b5b5;--sel:#1a6fd8;--ink:#1b1b1b;--muted:#6a6a6a;--warn:#c62828;--navy:#2d3748}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit}
button{background:#f5f5f5;border:1px solid #9a9a9a;border-radius:3px;padding:6px 10px;cursor:pointer;font-weight:600;color:var(--ink)}
button:hover:not(:disabled){background:#fff;border-color:#555}
button:disabled{color:#999;cursor:default;font-weight:500}
button.primary{background:var(--sel);border-color:#0f55ac;color:#fff}
button.primary:hover{background:#2b7ef0}
button.danger{color:var(--warn)}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
header select{padding:5px 8px;border-radius:3px;border:1px solid #888;min-width:160px}
header button{padding:5px 10px;font-weight:500}
header .sp{flex:1}
#status{font-size:12.5px;opacity:.92}
#status.act{cursor:pointer;text-decoration:underline}
#show{display:none;position:fixed;inset:0;z-index:40;background:#fff;overflow:auto;padding:28px 48px 56px}
#show.open{display:block}
#showBody{max-width:1150px;margin:0 auto;font-size:16px}
#showExit{position:fixed;top:12px;right:16px;z-index:41}
#showBar{position:fixed;left:0;right:0;bottom:0;padding:6px 16px;background:#f1f1f1;border-top:1px solid #ccc;color:#666;font-size:13px;display:flex;justify-content:space-between}
#lock{display:none;position:fixed;inset:0;z-index:50;background:rgba(228,228,228,.97);align-items:center;justify-content:center;cursor:pointer;text-align:center}
#lock.open{display:flex}
.lockbox{background:#fff;border:1px solid #999;border-radius:8px;padding:28px 40px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-width:520px}
.lockbox h2{margin:0 0 10px}
.lockmsg{color:var(--warn);min-height:1em}
#status.err{color:#ffb4b4}
#app{flex:1;display:flex;min-height:0}
#side{width:560px;flex:none;background:var(--bg);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
#side{scrollbar-width:none;-ms-overflow-style:none}
#side::-webkit-scrollbar{display:none}
.sec{padding:10px}
.row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start}
.btns{display:flex;flex-direction:column;gap:5px}
.btns hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin:10px 0 1px;padding-bottom:3px;border-bottom:1px solid #c9ccd1}
.btns>.grp:first-child{margin-top:0}
#side button.active{background:#dbe8fb;border-color:#1f3a5f;box-shadow:inset 3px 0 0 #1f3a5f;color:#1f3a5f}
#stuList{resize:none;height:auto!important;min-height:120px;contain:size}
#side>.sec:first-of-type{flex:2 1 0;display:flex;flex-direction:column;min-height:min-content}
#side>.sec:first-of-type .row{flex:1;min-height:0;align-items:stretch}
#side button{padding:3px 8px}
#side .btns{gap:3px}
#side .btns hr{margin:2px 0}
#side>.sec{padding:6px 8px}
#side .atitle{font-size:17px;min-height:30px;padding:3px 8px;margin-bottom:4px}
#side>.sec:last-of-type{flex:1;min-height:150px;display:flex;flex-direction:column}
#side>.sec:last-of-type .row{flex:1;min-height:0}
#side>.sec:last-of-type .row>div:last-child{display:flex;flex-direction:column;min-height:0}
#asList{flex:1;height:auto!important;min-height:60px}
.btns button{width:100%}
.list{background:#fff;border:1px solid #777;height:200px;overflow:auto;padding:2px 0;user-select:none}
.li{padding:0 8px;height:21px;line-height:21px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;break-inside:avoid}
.list.two{column-count:2;column-gap:0;column-fill:auto;column-rule:1px solid #ddd}
.li.sel{background:var(--sel);color:#fff}
.li:hover:not(.sel){background:#e8f0fb}
.bar{height:12px;background:#333;flex:none}
.atitle{background:#fffbc9;border:1px solid #aaa;padding:6px 8px;font-size:20px;font-weight:600;margin-bottom:6px;min-height:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd{color:#0a1fb8;font-weight:700;font-size:13px;margin-bottom:3px}
#main{flex:1;overflow:auto;padding:18px 22px;background:#fff}
h2{margin:0 0 4px;font-size:22px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head .sp{flex:1}
.head>button{align-self:flex-start}
.dist{margin:0 0 12px}
.disttl{font-weight:600;margin-bottom:4px}
.distbox{display:inline-flex;align-items:flex-end;gap:3px;padding:8px 10px 6px;border:1px solid #cfcfcf;border-radius:6px}
.dcol{width:64px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.dn{font-size:15px;font-weight:600}
.dbar{width:42px;background:#5b7fb5;border-bottom:1px solid #5b7fb5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dl{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap}
.sub{color:var(--muted);margin:0 0 12px}
.ovr{font-size:22px;border:2px solid var(--navy);border-radius:6px;padding:3px 14px;margin-left:8px;white-space:nowrap}
.ovr b{font-size:26px}
.ovr-sub{font-size:20px;line-height:1.35;color:var(--muted);text-align:left}
.popts{margin:0 0 10px;padding:6px 10px;background:#f1f5fb;border:1px solid #c9d6ea;border-radius:4px;display:flex;gap:18px;align-items:center}
.popts label{cursor:pointer}
.popts.stack{flex-direction:column;align-items:stretch;gap:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.prow .pk{min-width:86px}
.prow button{padding:3px 12px}
.rsel{margin:0 0 14px;padding:8px 12px;background:#fff;border:1px solid #c9d6ea;border-radius:4px}
.rsel-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rsel-h button{padding:3px 9px;font-weight:500}
.rsel-g{columns:3;column-gap:16px;max-height:210px;overflow:auto}
.rsel-g label{display:block;cursor:pointer;white-space:nowrap;padding:1px 0}
.rep-print{display:block;max-width:780px;margin:0 auto 26px;padding:22px 28px;background:#fff;border:1px solid #cfcfcf;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.only-print{display:none}
#pfoot{display:none}
.rpup{color:#1a7f37}.rpdn{color:#b42318}
.sh{font-size:15px;margin:6px 0 6px}
.rep-print,.rep-print *{font-family:Arial,Helvetica,sans-serif}
.rp-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;min-height:34px;padding-bottom:6px;border-bottom:2px solid #1f3a5f}
.rp-logo img{max-height:60px;max-width:240px;display:block}
.rp-teacher{font-size:16px;font-weight:600;color:#1f3a5f}
.rp-box{display:flex;border:1.5px solid #1f3a5f;border-radius:8px;overflow:hidden;margin-bottom:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-b1{width:34%;background:#e8eef7;border-right:1.5px solid #1f3a5f;padding:8px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:92px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-t{font-weight:800;font-size:16px;letter-spacing:.04em;color:#1f3a5f}
.rp-c{font-size:16px;font-weight:600}
.rp-d{font-size:11px;color:#444}
.rp-b2{flex:1;padding:8px 14px;display:flex;justify-content:space-between;align-items:flex-start}
.rp-nm{font-size:24px;font-weight:700;margin-top:4px}
.rp-rc{display:flex;flex-direction:column;align-items:flex-start}
.rp-ov{font-size:24px;font-weight:800;color:#1f3a5f;border:2px solid #1f3a5f;border-radius:8px;padding:0 12px;line-height:1.35}
.rp-sm{font-size:11px;color:#444;line-height:1.5;margin-top:6px;text-align:left}
table.rp{width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:20px;font-size:13px;line-height:1.3;border:1.5px solid #1f3a5f;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.rp th,table.rp td{padding:3px 8px;text-align:left;border:0}
table.rp tr.rp-h th{padding:7px 8px;font-size:13px;font-weight:700;line-height:1.15;background:#e8eef7;color:#1f3a5f;border-bottom:1.5px solid #1f3a5f;vertical-align:bottom;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.rp tr:not(.rp-h) td{border-bottom:1px solid #dde3ec}
table.rp tr:not(.rp-h):nth-child(even) td{background:#f6f8fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.rp tr:last-child td{border-bottom:0}
table.rp .rp-l{border-right:1.5px solid #1f3a5f;font-size:13px}
table.rp tr.rp-h th.rp-l{width:34%;font-size:16px;font-weight:800;text-align:center;letter-spacing:.04em}
table.rp .rp-s{font-size:11px;font-weight:400;letter-spacing:0;color:#444}
table.rp .r{text-align:right;padding-right:16px}
table.rp .c{text-align:center}
table.rp .b{font-weight:800}
table.rp .rpup{color:#1a7f37}
table.rp .rpdn{color:#b42318}
table.rp tr{page-break-inside:avoid}
.popts .pl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;flex:1}
.popts>label{margin-left:auto;white-space:nowrap}
.tbl{border-collapse:collapse;margin-bottom:18px}
.tbl th,.tbl td{border:1px solid #cfcfcf;padding:4px 9px;vertical-align:middle}
.tbl th{background:#efefef;text-align:center;font-weight:600}
.tbl td.c,.tbl th.c{text-align:center}
.classrep td:first-child,.classrep th:first-child{text-align:left}
.tbl tr.foot td{background:#f5f5f5;font-weight:600}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:#eaf2fd}
.tbl td.dim{color:#bbb;background:#fafafa}
.b{font-weight:700}
.wt,.of{font-size:11.5px;color:var(--muted);font-weight:400}
.scell{padding:3px 8px}
.scell .mkc{display:inline-block;white-space:nowrap;margin:2px 14px 2px 0}
.scell input.mk{width:48px}
.scell .of{margin-left:-3px}
input.mk{width:58px;text-align:center;padding:3px;border:1px solid #bbb;border-radius:3px}
input.mk:focus{outline:2px solid var(--sel);border-color:var(--sel)}
input.mk.bad{background:#ffd6d6;border-color:var(--warn)}
input.mk.blank{background:#fff4c2;border-color:#e0b84a}
input.mk.over{background:#ffe08a;border:2px solid #d97706;font-weight:700;color:#7a3e00}
a.lnk{color:#0b4fb3;cursor:pointer;text-decoration:underline}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#eee;font-size:12px}
textarea.note{width:100%;min-height:70px;padding:6px;border:1px solid #bbb;border-radius:3px;resize:vertical}
.hint{color:var(--muted);font-size:12.5px}
.drop{color:#b45309;font-size:11px;margin-left:3px}
.warnbar{background:#fff8e1;border:1px solid #f0d58a;color:#7a4b00;border-radius:6px;padding:6px 10px;margin:0 0 10px}
textarea.cm{width:100%;min-width:420px;min-height:64px;padding:6px;border:1px solid #bbb;border-radius:3px;resize:vertical;font:inherit;line-height:1.4}
.ptext{display:none}
tr.warn td{background:#fff8e1}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:6px;min-width:420px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mbox h3{margin:0;padding:14px 18px;border-bottom:1px solid #ddd;font-size:17px}
.mbody{padding:14px 18px;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid #ddd;display:flex;justify-content:flex-end;gap:8px}
.mbody label{display:block;font-weight:600;margin:8px 0 3px}
.mbody input[type=text],.mbody input[type=date],.mbody textarea,.mbody select{width:100%;padding:6px;border:1px solid #aaa;border-radius:3px}
.mbody input.n{width:80px;padding:4px;border:1px solid #aaa;border-radius:3px}
.mbody textarea{min-height:110px}
.mbody .strow{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.mbody .strow .stn{flex:1;min-width:280px}
.mbody .strow label{display:inline-flex;align-items:center;gap:4px;margin:0;font-weight:600;cursor:pointer}
#stMore{margin:4px 0 8px}

.stu-rep{margin-bottom:0}
.gridpage{background:#fff;color:#000}
.g-head{position:relative}
.g-title{position:absolute;left:0;top:0;text-align:center;line-height:1.15}
.g-t1{font-size:22px;font-weight:700;margin-top:-.14em}
.g-t2{font-size:14px}
.g-t3{font-size:20px;font-weight:700}
.gtbl{border-collapse:collapse;table-layout:fixed;border:2px solid #000}
.gtbl td{border-left:1px solid #000;border-right:1px solid #000;border-top:1px solid #999;border-bottom:1px solid #999;padding:0 6px;overflow:hidden;white-space:nowrap;font-size:inherit;line-height:1.1}
.gtbl tr.g-first td{border-bottom:1px solid #999}
.gtbl td.g-sd{border-left:2px solid #000}
.gtbl tr.g-lastlab td{border-bottom:2px solid #000}
.gtbl tr.g-first td{border-top:2px solid #000}
.gtbl td.g-lab{text-align:right;font-weight:700;padding-right:8px}
.gtbl td.g-nm{padding-left:14px}
@page{margin:0}
.classrep td:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media print{
  #show{display:none!important}
  .classrep th,.classrep td{padding:1.5px 7px;font-size:12px;line-height:1.15}
  .classrep .wt{font-size:9px}
  .classrep{margin-bottom:0}
  .stu-rep{border:none;margin:0}
  .ptext{display:block;white-space:pre-wrap}
  textarea.cm{display:none}
  tr.warn td{background:none}
  header,#side,.noprint,button{display:none!important}
  body{display:block;height:auto;background:#fff}
  #app{display:block}
  #main{overflow:visible;padding:10mm}
  input.mk{border:none;width:auto}
  input.mk.blank{background:none;border:none}
  input.mk.over{background:none;border:none;font-weight:inherit;color:inherit}
  .of{display:none}
  .only-print{display:block!important}
  #pfoot{position:fixed;left:0;right:0;bottom:5mm;text-align:center;font:8.5px Arial,Helvetica,sans-serif;color:#666}
  .rep-screen{display:none!important}
  .rep-print{max-width:none;margin:0;padding:0;border:0;box-shadow:none;background:none;font-family:Arial,Helvetica,sans-serif;color:#000}
  .wtt{display:none!important}
  .scell .of{display:inline}
  .scell input.mk{width:30px;padding:0}
  .scell .mkc{margin-right:10px}
  .stu-rep .tbl th,.stu-rep .tbl td{padding:3px 6px;font-size:12.5px}
  .tbl tr{page-break-inside:avoid}
  .stu-rep{page-break-after:always}
  .stu-rep+.stu-rep{padding-top:10mm}
  .stu-rep:last-child{page-break-after:auto}
  h3{page-break-after:avoid}
}
</style>
</head>
<body>
<header>
  <h1>Grader</h1>
  <select id="classSel" title="Class"></select>
  <button data-act="newClass">New Class</button>
  <select id="classMenu" title="Class Options"><option value="">Class Options</option><option value="rename">Rename Class</option><option value="teacher">Teacher Name</option><option value="drops">Mark-Drop Flag</option><option value="archive">Archive Class</option><option value="archived">Archived Classes</option><option value="del">Delete Class</option></select>
  <button data-act="settings">Categories &amp; Weights</button>
  <button data-act="about">About</button>
  <span class="sp"></span>
  <span id="status"></span>
</header>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="pfoot" class="only-print">Created with Grader</div>
<div id="modal"></div>
<div id="show" data-rnd="1"><button id="showExit">Exit (Esc)</button><div id="showBody"></div><div id="showBar"><span>↑ ↓ change student · Esc to exit</span><span id="showCount"></span></div></div>
<div id="lock"><div class="lockbox"><h2>Grader</h2><p><b>Click anywhere to load your classes</b> from your Grader folder.</p><p id="lockFolder" class="hint"></p><p id="lockMsg" class="lockmsg"></p><p><a id="lockOther" href="#">Choose a different folder</a></p></div></div>

<script>
(function(){
'use strict';

/* ================= Data ================= */
const LEGACY='gradebook-data.json', LS='gradebook-v1', LSCUR='gradebook-current';
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sep.','Oct.','Nov.','Dec.'];

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return '—';const p=iso.split('-');if(p.length!==3)return iso;return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0]}

function defaultCats(){
  return [['Knowledge','K',20],['Application','A',20],['Inquiry','I',10],['Communication','C',10],['Participation','P',5],['Culminating','Cu',15],['Exam','E',20]]
    .map(([name,abbr,weight])=>({id:uid(),name,abbr,weight}));
}
function newClass(name){return {id:uid(),name,categories:defaultCats(),students:[],assessments:[],notes:'',commentBank:null,comments:{}}}
function blankDb(){const c=newClass('Class 1');return {version:1,modified:0,currentClass:c.id,classes:[c]}}

let db=null, view={type:'welcome'}, selStu=null, selAss=null;
let printOpts={avg:false,rank:false,unit:true,cat:true};
try{const o=JSON.parse(localStorage.getItem('gradebook-printopts')||'null');if(o)printOpts={avg:!!o.avg,rank:!!o.rank,unit:o.unit!==false,cat:o.cat!==false}}catch(e){}
const cls=()=>db.classes.find(c=>c.id===db.currentClass)||db.classes[0];
const A=id=>cls().assessments.find(a=>a.id===id);
const S=id=>cls().students.find(s=>s.id===id);
function sorted(){const cmp=(x,y)=>x.localeCompare(y,undefined,{sensitivity:'base',numeric:true});return cls().students.slice().sort((a,b)=>cmp(a.last,b.last)||cmp(a.first,b.first))}
const nm=s=>esc(s.last)+', '+esc(s.first);

/* ================= Calculations ================= */
function catPct(a,c,s){
  const cfg=a.cats.find(x=>x.catId===c); if(!cfg)return null;
  const m=a.marks[s]&&a.marks[s][c];
  if(typeof m!=='number'||!isFinite(m))return null;
  return m/cfg.outOf*100;
}
function assessPct(a,s){
  let num=0,den=0;
  for(const cfg of a.cats){const p=catPct(a,cfg.catId,s);if(p!=null){num+=p*cfg.weight;den+=cfg.weight}}
  return den>0?num/den:null;
}
const unitOf=a=>String(a.unit==null?'':a.unit).trim();
const dn=a=>unitOf(a)?'Unit '+unitOf(a)+' '+a.name:a.name;
function unitList(){
  const set=[...new Set(cls().assessments.map(unitOf).filter(Boolean))];
  return set.sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));
}
function catAvg(s,c,unit){
  let num=0,den=0;
  for(const a of cls().assessments){
    if(unit!==undefined&&unit!==null&&unit!==''&&unitOf(a)!==unit)continue;
    const cfg=a.cats.find(x=>x.catId===c); if(!cfg)continue;
    const p=catPct(a,c,s); if(p!=null){num+=p*cfg.weight;den+=cfg.weight}
  }
  return den>0?num/den:null;
}
function overall(s,unit){
  let num=0,den=0;
  for(const k of cls().categories){const p=catAvg(s,k.id,unit);if(p!=null){num+=p*k.weight;den+=k.weight}}
  return den>0?num/den:null;
}
let dropPts=10;try{const v=parseFloat(localStorage.getItem('grader-droppts'));if(v>0)dropPts=v}catch(e){}
let dropOn=false;try{dropOn=localStorage.getItem('grader-dropflag')==='1'}catch(e){}
function unitDrop(sid){
  const us=unitList().filter(u=>/^\d+$/.test(u)).sort((x,y)=>x-y);
  const ms=us.map(u=>({u,m:overall(sid,u)})).filter(x=>x.m!=null);
  if(ms.length<2)return null;
  const p=ms[ms.length-2],l=ms[ms.length-1];
  return p.m-l.m>=dropPts-1e-9?{from:p.u,to:l.u,a:p.m,b:l.m}:null;
}
function rankOf(sid,unit){
  const mine=overall(sid,unit);if(mine==null)return null;
  const vals=cls().students.map(s=>overall(s.id,unit)).filter(v=>v!=null);
  return {rank:1+vals.filter(v=>v>mine+1e-9).length,n:vals.length};
}
function medOf(arr){const v=arr.filter(x=>x!=null).sort((a,b)=>a-b);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2}
function avgOf(arr){const v=arr.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
const pfDec=x=>x==null?'':(Math.round(x*10)/10)+'%';
const pf=pfDec;

function calcText(el){
  const d=el.dataset;
  const pf=(classRound&&el.closest('[data-rnd]'))?(x=>x==null?'':Math.round(x)+'%'):pfDec;
  switch(d.calc){
    case 'apct': return pf(assessPct(A(d.a),d.s));
    case 'cavg': return pf(catAvg(d.s,d.c));
    case 'ucavg': return pf(catAvg(d.s,d.c,d.u));
    case 'uovr': return pf(overall(d.s,d.u));
    case 'uclsavg': return pf(avgOf(cls().students.map(s=>overall(s.id,d.u))));
    case 'rank': {const r=rankOf(d.s,d.u);return r?r.rank+' of '+r.n:''}
    case 'ovrp': return pf(overall(d.s));
    case 'colavg': {const a=A(d.a);return pf(avgOf(cls().students.map(s=>catPct(a,d.c,s.id))))}
    case 'aavg': {const a=A(d.a);return pf(avgOf(cls().students.map(s=>assessPct(a,s.id))))}
    case 'cc': return pf(avgOf(cls().students.map(s=>catAvg(s.id,d.c))))
    case 'cov': return pf(avgOf(cls().students.map(s=>overall(s.id))))
    case 'cmed': return pf(medOf(cls().students.map(s=>overall(s.id))))
    case 'aavgc': {const a=A(d.a);return pf(avgOf(cls().students.map(s=>assessPct(a,s.id))))}
  }
  return '';
}
let showDist=false;try{showDist=localStorage.getItem('grader-dist')==='1'}catch(e){}
const DIST_BANDS=[['90–100',90],['80–89',80],['70–79',70],['60–69',60],['50–59',50],['<50',-Infinity]];
function distHtml(vals,what){

function refreshCalcs(){document.querySelectorAll('[data-calc]').forEach(el=>{if(el.dataset.calc==='dist')el.innerHTML=distFor(el);else el.textContent=calcText(el)});if(typeof updateStudentSummary==='function')updateStudentSummary()}

let dirHandle=null, saveTimer=null, saving=false, again=false, lastSaved=null, fileState='local', fileMsg='';
const fileOf={}, fileClassName={}, lastWritten={}, backedUp=new Set();
const canFolder=typeof window.showDirectoryPicker==='function';

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('gradebook-handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const r=d.transaction('h').objectStore('h').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}

function setStatus(state,msg){
  fileState=state; fileMsg=msg||'';
  const el=$('#status'); el.className=''; el.removeAttribute('title');
  let t='';
  if(!canFolder)t='Saved in this browser only. Use Chrome or Edge to save class files in a folder;';
  else if(state==='loading')t='Loading classes…';
  else if(state==='saving')t='Saving…';
  else if(state==='needperm')t='Waiting for access to your Grader folder…';
  else if(state==='ok'){
    t='Saved to folder “'+(dirHandle?dirHandle.name:'')+'” · '+db.classes.length+' class file'+(db.classes.length===1?'':'s')+' · '+(lastSaved?lastSaved.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'');
    el.classList.add('act');el.title='Click to choose a different folder';
  }
  else if(state==='error'){t='Save error: '+msg+' (click to retry)';el.className='err act'}
  else{t='Not saving to a folder yet. Click here and choose the folder this file is in.';el.classList.add('act')}
  el.textContent=t;
}

function markDirty(){
  db.modified=Date.now();
  const c=cls();if(c)c.modified=db.modified;
  try{localStorage.setItem(LS,JSON.stringify(db));localStorage.setItem(LSCUR,db.currentClass)}catch(e){}
  clearTimeout(saveTimer);
  if(dirHandle){setStatus('saving');saveTimer=setTimeout(saveFile,500)}else setStatus('local');
}

function safeName(n){
  let s=String(n==null?'':n).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'');
  if(!s)s='Class';
  s=s.slice(0,100).replace(/[. ]+$/,'')||'Class';
  if(/^(con|prn|aux|nul|com\d|lpt\d)$/i.test(s))s='_'+s;
  return s;
}
const isClass=d=>!!d&&typeof d==='object'&&!Array.isArray(d)&&Array.isArray(d.students)&&Array.isArray(d.assessments)&&Array.isArray(d.categories);

async function nameExists(name){
  try{await dirHandle.getFileHandle(name);return true}
  catch(e){if(e.name==='NotFoundError')return false;return true}
}
async function pickName(c){
  const mine=fileOf[c.id];
  if(mine&&fileClassName[c.id]===c.name)return mine;
  const base=safeName(c.name);
  const others=new Set(Object.entries(fileOf).filter(([id])=>id!==c.id).map(([,n])=>n.toLowerCase()));
  for(let i=1;i<200;i++){
    const cand=i===1?base+'.json':base+' ('+i+').json';
    if(mine&&mine.toLowerCase()===cand.toLowerCase())return mine;
    if(others.has(cand.toLowerCase()))continue;
    if(!(await nameExists(cand)))return cand;
  }
  return base+'-'+uid()+'.json';
}

async function saveFile(){
  if(!dirHandle){setStatus('local');return}
  if(saving){again=true;return}
  saving=true;
  try{
    if(await dirHandle.queryPermission({mode:'readwrite'})!=='granted'){setStatus('needperm');showLock();return}
    const ids=new Set(db.classes.map(c=>c.id));
    for(const id of Object.keys(fileOf)){
      if(ids.has(id))continue;
      try{await dirHandle.removeEntry(fileOf[id])}catch(e){if(e.name!=='NotFoundError')throw e}
      delete fileOf[id];delete fileClassName[id];delete lastWritten[id];
    }
    for(const c of db.classes){
      const body=JSON.stringify(c,null,2);
      const want=await pickName(c);
      const old=fileOf[c.id];
      if(old===want&&lastWritten[c.id]===body)continue;
      if(!backedUp.has(c.id)){
        try{
          const fh0=await dirHandle.getFileHandle(want);
          const txt=await (await fh0.getFile()).text();
          if(txt.trim()){const bh=await dirHandle.getFileHandle(want+'.bak',{create:true});const w0=await bh.createWritable();await w0.write(txt);await w0.close()}
        }catch(e){}
        backedUp.add(c.id);
      }
      const fh=await dirHandle.getFileHandle(want,{create:true});
      const w=await fh.createWritable();await w.write(body);await w.close();
      if(old&&old!==want){try{await dirHandle.removeEntry(old)}catch(e){}}
      fileOf[c.id]=want;fileClassName[c.id]=c.name;lastWritten[c.id]=body;
    }
    lastSaved=new Date();setStatus('ok');
  }catch(e){console.error(e);setStatus('error',e.message||String(e))}
  finally{saving=false;if(again){again=false;saveFile()}}
}

async function loadFolder(interactive){
  setStatus('loading');
  const found=[],skipped=[];let legacy=null;
  try{
    for await(const [name,h] of dirHandle.entries()){
      if(h.kind!=='file'||!/\.json$/i.test(name))continue;
      let d;try{d=JSON.parse(await (await h.getFile()).text())}catch(e){skipped.push(name);continue}
      if(name===LEGACY&&d&&Array.isArray(d.classes)){legacy={name,d};continue}
      if(isClass(d))found.push({name,c:d});
    }
  }catch(e){console.error(e);setStatus('error',e.message||String(e));return}
  if(legacy){
    const have=new Set(found.map(f=>f.c.id));
    legacy.d.classes.filter(isClass).forEach(c=>{if(!have.has(c.id))found.push({name:null,c,fromLegacy:true})});
  }
  [fileOf,fileClassName,lastWritten].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  backedUp.clear();
  found.sort((a,b)=>(b.c.modified||0)-(a.c.modified||0));
  const seen=new Set(),classes=[];
  found.forEach(f=>{
    const c=f.c;let fresh=!!f.fromLegacy;
    if(!c.id||seen.has(c.id)){c.id=uid();fresh=true}
    seen.add(c.id);
    if(!c.name)c.name=f.name?f.name.replace(/\.json$/i,''):'Class';
    if(f.name){fileOf[c.id]=f.name;fileClassName[c.id]=c.name}
    if(!fresh)lastWritten[c.id]=JSON.stringify(c,null,2);
    classes.push(c);
  });
  if(classes.length){
    if(interactive){
      const extra=db.classes.filter(m=>!seen.has(m.id)&&((m.students&&m.students.length)||(m.assessments&&m.assessments.length)||m.commentBank));
      if(extra.length&&confirm('This browser also holds '+extra.length+' class(es) that are not in this folder:\n\n'+extra.map(x=>'• '+x.name).join('\n')+'\n\nOK = copy them into the folder too.\nCancel = leave them out.'))extra.forEach(c=>classes.push(c));
    }
    classes.sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{numeric:true}));
    db.classes=classes;
    let cur=null;try{cur=localStorage.getItem(LSCUR)}catch(e){}
    db.currentClass=classes.some(c=>c.id===cur)?cur:classes[0].id;ensureActive();
  }
  selStu=null;selAss=null;view={type:'welcome'};
  try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}
  renderAll();
  await saveFile();
  if(legacy&&fileState==='ok')await retireLegacy(legacy);
  if(skipped.length){if(interactive)alert('These .json files in the folder could not be read and were skipped:\n\n'+skipped.join('\n'));else console.warn('Skipped unreadable files:',skipped)}
}

async function retireLegacy(l){
  try{
    const ids=new Set(db.classes.map(c=>c.id));
    if(!l.d.classes.filter(isClass).every(c=>ids.has(c.id)))return;
    const h=await dirHandle.getFileHandle(l.name);
    const txt=await (await h.getFile()).text();
    const b=await dirHandle.getFileHandle(l.name+'.bak',{create:true});
    const w=await b.createWritable();await w.write(txt);await w.close();
    await dirHandle.removeEntry(l.name);
  }catch(e){console.warn('Could not retire the old single-file data:',e)}
}

function showLock(msg){
  const el=$('#lock');el.classList.add('open');
  $('#lockMsg').textContent=msg||'';

  $('#lock').classList.remove('open');

async function unlock(){
  if(!dirHandle)return;
  try{
    const p=await dirHandle.requestPermission({mode:'readwrite'});
    if(p==='granted'){hideLock();await loadFolder(false);return}
    showLock('Access was not allowed. Click to try again.');
  }catch(e){showLock('Could not open the folder ('+(e.message||e)+'). Click to try again, or choose the folder again.')}
}
async function connectFolder(){
  if(!canFolder){alert('This browser cannot save to a folder. Use Chrome or Edge.');return}
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite',id:'gradebook'});
    dirHandle=h;await idbSet('dir',h);hideLock();
    await loadFolder(true);
  }catch(e){if(e.name!=='AbortError')alert('Could not open the folder: '+(e.message||e))}
}
document.addEventListener('click',e=>{
  if(e.target.closest('#lock')){
    if(e.target.id==='lockOther'){e.preventDefault();connectFolder()}else unlock();
    return;
  }
  if(e.target.closest('#status')&&canFolder){
    if(fileState==='error')saveFile();
    else if(fileState==='ok'){if(confirm('Save to a different folder?\n\nYour classes are currently loaded from and saved to “'+(dirHandle?dirHandle.name:'')+'”.'))connectFolder()}
    else if(fileState==='local')connectFolder();
  }
});

function readCats(m){
  const out=[];let bad=false;
  m.querySelectorAll('.cc').forEach(cb=>{

function normGender(g){
  g=String(g||'').trim();
  if(/^(m|male)$/i.test(g))return 'M';
  if(/^(f|female)$/i.test(g))return 'F';
  return g;
}
function parseStudentLine(l){
  let namePart=l,gender='';
  if(l.includes('\t')){const t=l.split('\t');namePart=t[0].trim();gender=(t[1]||'').trim()}
  else if(l.includes(',')){
    const p=l.split(',').map(x=>x.trim());
    if(p.length>=3){namePart=p[0]+', '+p[1];gender=p[2]}
    else if(/^(male|female)$/i.test(p[1])||(/^[mf]$/i.test(p[1])&&/\s/.test(p[0]))){namePart=p[0];gender=p[1]}
  }
  let first,last;
  if(namePart.includes(',')){const k=namePart.indexOf(',');last=namePart.slice(0,k).trim();first=namePart.slice(k+1).trim()}
  else{const w=namePart.split(/\s+/);last=w.length>1?w.pop():'';first=w.join(' ')}
  return {id:uid(),first,last,gender:normGender(gender),notes:''};
}
function openAddStudents(){
  const rowHtml=()=>'<div class="strow"><input type="text" class="stn" autocomplete="off"><label title="Male"><input type="checkbox" class="stg" data-g="M"> M</label><label title="Female"><input type="checkbox" class="stg" data-g="F"> F</label></div>';

    '<p class="hint">Press Enter after each name to start the next student. Press Enter on an empty name to finish. You can also paste a whole list of names.</p>',
    m=>{
      let last=null,n=0;
      m.querySelectorAll('.strow').forEach(r=>{
        const name=r.querySelector('.stn').value.trim();if(!name)return;
        const s=parseStudentLine(name);
        const g=r.querySelector('.stg:checked');if(g)s.gender=g.dataset.g;
        cls().students.push(s);last=s.id;n++;
      });
      if(!n){alert('Enter at least one student name.');return false}
      selStu=last;view={type:'student'};markDirty();renderAll();
    },'Add');
  const m=$('#modal'),box=m.querySelector('#stRows');
  const addRow=after=>{
    const d=document.createElement('div');d.innerHTML=rowHtml();const row=d.firstChild;
    if(after&&after.nextSibling)box.insertBefore(row,after.nextSibling);else box.appendChild(row);
    return row;
  };
  m.querySelector('#stMore').onclick=()=>addRow(null).querySelector('.stn').focus();
  box.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.classList.contains('stn')&&e.target.value.trim()){
      e.preventDefault();e.stopPropagation();
      addRow(e.target.closest('.strow')).querySelector('.stn').focus();
    }
  });
  box.addEventListener('change',e=>{
    const t=e.target;
    if(!t.classList.contains('stg')||!t.checked)return;
    t.closest('.strow').querySelectorAll('.stg').forEach(o=>{if(o!==t)o.checked=false});
  });
  box.addEventListener('paste',e=>{
    const t=e.target;if(!t.classList.contains('stn'))return;
    const text=(e.clipboardData||window.clipboardData).getData('text');
    if(!/[\r\n]/.test(text))return;
    e.preventDefault();
    const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if(!lines.length)return;
    t.value=lines[0];
    let row=t.closest('.strow');
    lines.slice(1).forEach(l=>{row=addRow(row);row.querySelector('.stn').value=l});
  });
}
function openEditStudent(){
  const s=S(selStu);if(!s){alert('Select a student first.');return}

/* ---- Spreadsheet import (.xlsx / .csv / .tsv) ---- */
async function inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('This is not a valid .xlsx file.');
  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    const ln=dv.getUint16(lo+26,true),le=dv.getUint16(lo+28,true),start=lo+30+ln+le;
    files[name]={method,data:u8.subarray(start,start+csize)};
    p+=46+nl+el+cl;
  }
  const read=async name=>{
    const f=files[name];if(!f)return null;
    const bytes=f.method===0?f.data:await inflateRaw(f.data);
    return td.decode(bytes);
  };
  return {files,read};
}
function colIndex(ref){const m=/^([A-Z]+)/i.exec(ref||'');if(!m)return 0;let n=0;for(const ch of m[1].toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1}
async function readXlsxRows(buf){
  const z=await unzip(buf);
  const parse=t=>new DOMParser().parseFromString(t,'application/xml');
  const texts=el=>Array.from(el.getElementsByTagName('t')).map(x=>x.textContent).join('');
  let shared=[];
  const sst=await z.read('xl/sharedStrings.xml');
  if(sst)shared=Array.from(parse(sst).getElementsByTagName('si')).map(texts);
  let sheetName=z.files['xl/worksheets/sheet1.xml']?'xl/worksheets/sheet1.xml':Object.keys(z.files).filter(k=>/^xl\/worksheets\/[^/]+\.xml$/.test(k)).sort()[0];
  if(!sheetName)throw new Error('No worksheet found in this file.');
  const doc=parse(await z.read(sheetName));
  const rows=[];
  Array.from(doc.getElementsByTagName('row')).forEach(r=>{
    const row=[];
    Array.from(r.getElementsByTagName('c')).forEach(c=>{
      const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];
      let val='';
      if(t==='s')val=v?(shared[+v.textContent]||''):'';
      else if(t==='inlineStr')val=texts(c);
      else if(v){val=v.textContent;if(/^-?\d+(\.\d+)?[eE]\+?\d+$/.test(val))val=String(Math.round(Number(val)))}
      row[colIndex(c.getAttribute('r'))]=String(val).trim();
    });
    const arr=Array.from(row,x=>x==null?'':x),ri=parseInt(r.getAttribute('r'),10);
    if(ri>0)rows[ri-1]=arr;else rows.push(arr);
  });
  return Array.from(rows,x=>x||[]);
}
function readDelimitedRows(text){
  const first=text.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')?'\t':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur.trim());cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur.trim());rows.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur.trim());rows.push(row)}
  return rows;
}
function studentsFromRows(rows){
  rows=rows.filter(r=>r.some(x=>x&&String(x).trim()));
  let ni=0,gi=1,ii=-1,start=0;
  const h=rows[0]||[];
  const find=re=>h.findIndex(x=>re.test(String(x||'').trim()));
  const n=find(/^(student\s*)?name$/i);
  if(n>=0){
    ni=n;start=1;
    const g=find(/^gender|^sex$/i),i=find(/^(student\s*)?(id|number)|^id$/i);
    gi=g;ii=i;
  }
  const out=[];
  for(let r=start;r<rows.length;r++){
    const row=rows[r];const raw=String(row[ni]||'').trim();if(!raw)continue;
    let last,first;
    if(raw.includes(',')){const k=raw.indexOf(',');last=raw.slice(0,k).trim();first=raw.slice(k+1).trim()}
    else{const w=raw.split(/\s+/);last=w.length>1?w.pop():'';first=w.join(' ')}
    out.push({id:uid(),first,last,gender:gi>=0?String(row[gi]||'').trim():'',notes:''});
  }
  return out;
}
async function parseStudentFile(file){
  const name=file.name.toLowerCase();
  let rows;
  if(/\.xlsx$/.test(name)){
    if(typeof DecompressionStream!=='function')throw new Error('This browser cannot read .xlsx files. Use a current Chrome or Edge, or save the sheet as .csv.');
    rows=await readXlsxRows(await file.arrayBuffer());
  }else if(/\.(csv|tsv|txt)$/.test(name)){
    rows=readDelimitedRows(await file.text());
  }else throw new Error('Please choose an .xlsx (or .csv) file.');
  const st=studentsFromRows(rows);
  if(!st.length)throw new Error('No students were found. Expected columns: Name, Gender, Id with Name as “Last, First”.');
  return st;
}

/* ---- Report comments ---- */
const ukey=u=>/^\d+$/.test(String(u))?String(+u):String(u);
const levelFor=m=>m>=80?'a thorough':m>=70?'a considerable':m>=60?'some':'a limited';
const cleanTxt=x=>String(x==null?'':x).replace(/\s+/g,' ').trim();
function parseCommentBank(rows){
  const r1=rows[0]||[];
  const width=Math.max(0,...rows.map(r=>(r||[]).length));
  // the grade-range row: the first row below the headings whose filled cells are all short ranges like "80-90"
  const isRange=t=>t.length<=40&&/\d+(?:\.\d+)?\s*[-–—]\s*\d+(?:\.\d+)?|under|below|less than|</i.test(t);
  let rr=-1;
  for(let r=1;r<rows.length&&rr<0;r++){
    const cells=(rows[r]||[]).map(cleanTxt).filter(Boolean);
    if(cells.length&&cells.every(isRange))rr=r;
  }
  if(rr<0)rr=2;
  const units={},ranges=[];
  for(let col=0;col<width;col++){
    const m=/(\d+)/.exec(cleanTxt(r1[col]));
    if(m){
      const opts=[];
      for(let r=1;r<rr;r++){const o=cleanTxt((rows[r]||[])[col]);if(o)opts.push(o)}
      if(opts.length)units[String(+m[1])]=opts;
    }
    const lab=cleanTxt((rows[rr]||[])[col]),nums=lab.match(/\d+(?:\.\d+)?/g);
    if(nums){
      const low=/under|below|less|</i.test(lab)?0:Math.min(...nums.map(Number));
      const options=[];
      for(let r=rr+1;r<rows.length;r++){const o=cleanTxt((rows[r]||[])[col]);if(o)options.push(o)}
      if(options.length)ranges.push({label:lab,low,options});
    }
  }
  if(!Object.keys(units).length)throw new Error('No unit comments found. Row 1 should have headings such as “Unit 1”, with the comments for each unit in the rows below it.');
  if(!ranges.length)throw new Error('No grade-range comments found. A row below the unit comments should have ranges such as “80-90”, with the comment options in the rows below it.');
  return {units,ranges};
}
async function parseCommentFile(file){
  const name=file.name.toLowerCase();let rows;
  if(/\.xlsx$/.test(name)){
    if(typeof DecompressionStream!=='function')throw new Error('This browser cannot read .xlsx files. Use a current Chrome or Edge, or save the sheet as .csv.');
    rows=await readXlsxRows(await file.arrayBuffer());
  }else if(/\.(csv|tsv|txt)$/.test(name))rows=readDelimitedRows(await file.text());
  else throw new Error('Please choose an .xlsx (or .csv) file.');
  const bank=parseCommentBank(rows);bank.source=file.name;bank.imported=todayISO();return bank;
}
function bankSummary(b){
  return '<b>'+esc(b.source||'comments')+'</b> · units with comments: '+Object.keys(b.units).sort((x,y)=>x-y).map(u=>u+' ('+(Array.isArray(b.units[u])?b.units[u].length:1)+')').join(', ')+' · grade ranges: '+
    b.ranges.slice().sort((x,y)=>y.low-x.low).map(r=>esc(r.label)+' ('+r.options.length+' option'+(r.options.length===1?'':'s')+')').join(', ');
}
function fillTemplate(t,s,level){
  const g=/^m/i.test(String(s.gender||'').trim())?'m':/^f/i.test(String(s.gender||'').trim())?'f':'';
  const P={he:{m:'he',f:'she'},his:{m:'his',f:'her'},him:{m:'him',f:'her'},himself:{m:'himself',f:'herself'}};
  return t.replace(/\((name|level|he|his|him|himself)\)/gi,(m0,k)=>{
    const key=k.toLowerCase();let r;
    if(key==='name')r=s.first;else if(key==='level')r=level;else r=g?P[key][g]:null;
    if(r==null||r==='')return m0;
    if(k[0]!==k[0].toLowerCase())r=r[0].toUpperCase()+r.slice(1);
    return r;
  });
}
const unitOpts=(bank,u)=>{const v=bank&&bank.units[ukey(u)];return Array.isArray(v)?v:(v?[v]:[])};
function bestUnitInfo(s){
  const bank=cls().commentBank;let best=null,ties=[];
  if(!bank)return {best,ties};
  unitList().forEach(u=>{
    if(!/^\d+$/.test(String(u).trim())||!unitOpts(bank,u).length)return;
    const m=overall(s.id,u);if(m==null)return;
    if(best===null||m>best.m+1e-9){best={u,m};ties=[best]}
    else if(Math.abs(m-best.m)<=1e-9)ties.push({u,m});
  });
  return {best,ties};
}
function bandIndexFor(bank,ov){
  const bands=bank.ranges.map((r,i)=>({r,i})).sort((a,b)=>b.r.low-a.r.low);
  if(!bands.length)return -1;
  const ovr=Math.round(ov);
  return (bands.find(b=>ovr>=b.r.low)||bands[bands.length-1]).i;
}
function commentStale(s){
  const c=cls(),cm=c.comments&&c.comments[s.id],bank=c.commentBank;
  if(!bank||!cm||!cm.text)return false;
  const ov=overall(s.id);if(ov==null)return false;
  const {ties}=bestUnitInfo(s);
  const unitOk=!ties.length||ties.some(t=>String(t.u)===String(cm.unit));
  const bandOk=(cm.band==null?-1:cm.band)===bandIndexFor(bank,ov);
  return !(unitOk&&bandOk);
}
function autoFillComments(){
  const c=cls();if(!c.commentBank)return;
  const pools={};let n=0;
  sorted().forEach(s=>{
    const cm=c.comments&&c.comments[s.id];if(cm&&cm.text)return;
    const r=genComment(s,pools);if(r){(c.comments=c.comments||{})[s.id]=r;n++}
  });
  if(n)markDirty();
}
function genComment(s,pools,prev){
  const bank=cls().commentBank;if(!bank)return null;
  const ov=overall(s.id);if(ov==null)return null;
  let {best,ties}=bestUnitInfo(s);
  if(ties.length>1)best=ties[Math.floor(Math.random()*ties.length)];
  // each student rolls their own random option (re-rolling one student avoids repeating their current option)
  const pick=(key,n,prevOpt)=>{
    let o=Math.floor(Math.random()*n);
    if(prevOpt!=null&&prevOpt>=0&&n>1)while(o===prevOpt)o=Math.floor(Math.random()*n);
    return o;
  };
  const parts=[];let uopt=-1;
  if(best){
    const uo=unitOpts(bank,best.u);
    uopt=pick('u'+ukey(best.u),uo.length,prev&&String(prev.unit)===String(best.u)?prev.uopt:null);
    parts.push(fillTemplate(uo[uopt],s,levelFor(Math.round(best.m))));
  }
  const bands=bank.ranges.map((r,i)=>({r,i})).sort((a,b)=>b.r.low-a.r.low);
  const ovr=Math.round(ov);
  let bi=-1,opt=-1;
  if(bands.length){
    const band=bands.find(b=>ovr>=b.r.low)||bands[bands.length-1];
    bi=band.i;
    opt=pick('b'+bi,band.r.options.length,prev&&prev.band===bi?prev.opt:null);
    parts.push(fillTemplate(band.r.options[opt],s,levelFor(ovr)));
  }
  return {text:parts.join(' '),unit:best?String(best.u):'',uopt,band:bi,opt};
}

function stuData(sid){
  const c=cls(),s=S(sid);
  const ents=[];let n=0;
  c.assessments.forEach(a=>{c.categories.forEach(k=>{
    const cfg=a.cats.find(x=>x.catId===k.id);if(!cfg)return;
    n++;const p=catPct(a,k.id,s.id),m=a.marks[s.id]&&a.marks[s.id][k.id];
    ents.push({n,a,k,cfg,p,m:typeof m==='number'?m:null,has:p!=null,unit:unitOf(a)});
  })});
  const got=ents.filter(e=>e.has),catW={},catEntW={};
  got.forEach(e=>{catEntW[e.k.id]=(catEntW[e.k.id]||0)+e.cfg.weight;catW[e.k.id]=e.k.weight});
  const catSum=Object.keys(catW).reduce((q,id)=>q+catW[id],0);
  ents.forEach(e=>{e.wf=e.has&&catSum>0&&catEntW[e.k.id]>0?100*(e.k.weight/catSum)*(e.cfg.weight/catEntW[e.k.id]):null;e.ca=avgOf(c.students.map(x=>catPct(e.a,e.k.id,x.id)))});
  const rows=ents.slice().sort((x,y)=>{
    if(x.unit!==y.unit){if(!x.unit)return 1;if(!y.unit)return -1;return x.unit.localeCompare(y.unit,undefined,{numeric:true})}
    return x.n-y.n;
  });
  const ul=unitList().map(u=>{
    const es=got.filter(e=>e.unit===u);if(!es.length)return null;
    return {label:u,cnt:es.length,term:es.reduce((q,e)=>q+e.wf,0),avg:overall(s.id,u),cl:avgOf(c.students.map(x=>overall(x.id,u)))};
  }).filter(Boolean);
  const cl=c.categories.map(k=>{
    const es=got.filter(e=>e.k.id===k.id);if(!es.length)return null;
    return {label:k.abbr,cnt:es.length,term:catSum>0?100*k.weight/catSum:0,avg:catAvg(s.id,k.id),cl:avgOf(c.students.map(x=>catAvg(x.id,k.id)))};
  }).filter(Boolean);
  const all=c.students.map(x=>overall(x.id));
  return {c,s,rows,ul,cl,ov:overall(s.id),cavg:avgOf(all),cmed:medOf(all),rk:rankOf(s.id)};
}

function showClose(){
  showOpen=false;$('#show').classList.remove('open');$('#showBody').innerHTML='';
  document.querySelectorAll('header,#app').forEach(e=>{e.inert=false});
}
document.addEventListener('keydown',e=>{
  if(!showOpen)return;
  const k=e.key;
  if(k==='Escape'){e.preventDefault();e.stopImmediatePropagation();showClose();return}
  let d=0;
  if(k==='ArrowDown'||k==='PageDown')d=1;else if(k==='ArrowUp'||k==='PageUp')d=-1;else return;
  e.preventDefault();e.stopImmediatePropagation();
  showIdx+=d;showRender();
},true);
document.addEventListener('click',e=>{if(e.target.closest('#showExit'))showClose()});

function renderMain(){
  const m=$('#main');
  m.toggleAttribute('data-rnd',['class','assess','student','allStudents'].includes(view.type));
  let h='';
  switch(view.type){
    case 'student':h=viewStudent();break;
    case 'assess':h=viewAssess();break;
    case 'multi':h=viewMulti();break;
    case 'class':h=viewClass();break;
    case 'allStudents':h=viewAllStudents();break;
    case 'notes':h=viewNotes();break;
    case 'comments':autoFillComments();h=viewComments();break;
    case 'grid':h=viewGrid();break;
    default:h=viewWelcome();
  }
  if(isRO())h='<div class="warnbar noprint">🗄 <b>Archived class</b> — read-only. <button data-act="restoreCur">Restore class</button></div>'+h;
  markActive();m.innerHTML=h;if(isRO())m.querySelectorAll('input.mk,textarea').forEach(x=>x.readOnly=true);refreshCalcs();m.querySelectorAll('textarea.cm').forEach(sizeTa);applyPageStyle();if(view.type==='grid')fitGridNames();
}
function renderAll(){renderHeader();renderSide();renderMain()}

/* ================= Events ================= */
function act(name){
  if(isRO()&&RO_ACTS.includes(name)){alert('This class is archived and read-only. Restore it to make changes.');return}
  switch(name){
    case 'restoreCur':restoreClass(db.currentClass);break;
    case 'classReport':view={type:'class'};renderMain();break;
    case 'printGrid':view={type:'grid'};renderMain();break;
    case 'ccatAll':classCatHidden[cls().id]=[];saveClassCats();renderMain();break;
    case 'ccatNone':classCatHidden[cls().id]=cls().categories.map(k=>k.id);saveClassCats();renderMain();break;
    case 'showMode':showStart();break;
    case 'allReports':view={type:'allStudents'};renderMain();break;
    case 'notes':view={type:'notes'};renderMain();break;
    case 'comments':view={type:'comments'};renderMain();break;
    case 'importComments':importComments();break;
    case 'genAll':generateAllComments();break;
    case 'copyAll':copyComments();break;
    case 'addStudents':openAddStudents();break;
    case 'editStudent':openEditStudent();break;
    case 'delStudent':delStudent();break;
    case 'newAssess':openAssessModal(false);break;
    case 'editAssess':openAssessModal(true);break;
    case 'delAssess':delAssess();break;
    case 'multiUpd':openMultiUpd();break;
    case 'newClass':newClassAct();break;
    case 'renameClass':renameClass();break;
    case 'delClass':delClass();break;
    case 'settings':openSettings();break;
    case 'print':window.print();break;
    case 'reportHdr':openReportHdr();break;
    case 'about':modal('About Grader','<p>Quality educational software belongs to everyone. As an open-source tool, Grader is completely free to use, share, and build upon.</p><p class="hint">Released under the MIT License. It is provided “as is”, without warranty of any kind. Please check calculations and printed reports before relying on them.</p><details><summary style="cursor:pointer">Show full license</summary><pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0">MIT License\n\nCopyright (c) 2026 Grader contributors\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the "Software"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.</pre></details>',()=>{},'Close');$('#modal .cancel').remove();break;
    case 'repAll':repExcl.clear();renderMain();break;
    case 'repNone':sorted().forEach(s=>repExcl.add(s.id));renderMain();break;
  }
}
document.addEventListener('click',e=>{
  if($('#modal').classList.contains('open')&&e.target.closest('#modal'))return;
  const t=e.target.closest('[data-act],[data-stu],[data-as],[data-goS],[data-goA],[data-regen],[data-copy]');
  if(!t)return;
  const d=t.dataset;
  if(d.act&&!t.disabled){act(d.act)}
  else if(d.stu){selStu=d.stu;view={type:'student'};renderSide();renderMain()}
  else if(d.as){selAss=d.as;view={type:'assess'};renderSide();renderMain()}
  else if(d.gos){selStu=d.gos;view={type:'student'};renderSide();renderMain()}
  else if(d.goa){selAss=d.goa;view={type:'assess'};renderSide();renderMain()}
  else if(d.regen){regenComment(d.regen)}
  else if(d.copy){copyComments(d.copy)}
});
['change','input'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(isRO()&&t.closest&&t.closest('#main')&&t.matches('input.mk,textarea')){e.stopImmediatePropagation();e.preventDefault();if(ev==='change')renderMain()}},true));
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dropToggle'){dropOn=!!t.checked;try{localStorage.setItem('grader-dropflag',dropOn?'1':'0')}catch(err){}renderSide();renderMain();return}
  if(t.id==='dropPts'){const v=parseFloat(t.value);if(v>0){dropPts=v;try{localStorage.setItem('grader-droppts',String(v))}catch(err){}}renderSide();renderMain();return}
  if(t.id==='classMenu'){const v=t.value;t.value='';if(v==='rename')renameClass();else if(v==='teacher')setTeacher();else if(v==='drops')dropSettings();else if(v==='archive')archiveClass();else if(v==='archived')showArchived();else if(v==='del')delClass();return}
  if(t.dataset&&t.dataset.gopt){
    const k=t.dataset.gopt,v=t.value,mm=$('#main'),sc=mm.scrollTop;
    if(t.type==='checkbox')gridOpts[k]=!!t.checked;
    else if(k==='title')gridOpts.titles[cls().id]=v;
    else if(k==='teacher')gridOpts.teachers[cls().id]=v;
    else if(k==='cols'||k==='extra'||k==='nlab'||k==='nsec')gridOpts[k]=parseInt(v,10)||0;
    else gridOpts[k]=v;
    try{localStorage.setItem('grader-gridopts',JSON.stringify(gridOpts))}catch(err){}
    renderMain();mm.scrollTop=sc;return;
  }
  if(t.dataset&&t.dataset.centries){classEntries=!!t.checked;try{localStorage.setItem('grader-classentries',classEntries?'1':'0')}catch(err){}renderMain();return}
  if(t.dataset&&t.dataset.csort){
    classSortMark=!!t.checked;renderMain();return;
  }
  if(t.dataset&&t.dataset.cround){
    classRound=!!t.checked;try{localStorage.setItem('grader-classround',classRound?'1':'0')}catch(err){}
    renderMain();return;
  }
  if(t.dataset&&t.dataset.ccat){
    const id=cls().id,set=new Set(classCatHidden[id]||[]);
    if(t.checked)set.delete(t.dataset.ccat);else set.add(t.dataset.ccat);
    classCatHidden[id]=[...set];saveClassCats();renderMain();return;
  }
  if(t.dataset&&t.dataset.rsel){
    const mm=$('#main'),sc=mm.scrollTop;
    if(t.checked)repExcl.delete(t.dataset.rsel);else repExcl.add(t.dataset.rsel);
    renderMain();mm.scrollTop=sc;return;
  }
  if(t.dataset&&t.dataset.dist){
    showDist=!!t.checked;try{localStorage.setItem('grader-dist',showDist?'1':'0')}catch(err){}
    renderMain();return;
  }
  if(t.dataset&&t.dataset.amiss){assessMissOnly=!!t.checked;renderMain();return}
  if(t.dataset&&t.dataset.asort){
    assessSortMark=!!t.checked;renderMain();return;
  }
  if(t.dataset&&t.dataset.popt){
    printOpts[t.dataset.popt]=!!t.checked;
    try{localStorage.setItem('gradebook-printopts',JSON.stringify(printOpts))}catch(err){}
    renderMain();return;
  }
  if(t.id==='classSel'){db.currentClass=t.value;selStu=null;selAss=null;view={type:'welcome'};markDirty();renderAll();return}
  if(!t.classList.contains('mk'))return;
  const a=A(t.dataset.a),c=t.dataset.c,s=t.dataset.s;
  const v=parseMark(t.value);
  if(v===null){
    t.classList.add('bad');t.value=(a.marks[s]&&a.marks[s][c]!==undefined)?a.marks[s][c]:'';
    setTimeout(()=>t.classList.remove('bad'),700);return;
  }
  a.marks[s]=a.marks[s]||{};
  if(v===undefined)delete a.marks[s][c];else a.marks[s][c]=v;
  a.updated=todayISO();
  t.value=v===undefined?'':v;
  markDirty();refreshCalcs();{const u=document.querySelector('#side .upd'),cur=A(selAss);if(u&&cur)u.textContent='Updated: '+fmtDate(cur.updated)}
});
function parseMark(str){
  str=str.trim();if(str==='')return undefined;
  const n=Number(str);return(isFinite(n)&&n>=0)?n:null;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('mk')){
    const aa=A(t.dataset.a),cf=aa&&aa.cats.find(x=>x.catId===t.dataset.c),n=Number(t.value.trim());
    const over=!!(cf&&t.value.trim()!==''&&isFinite(n)&&n>cf.outOf);
    t.classList.toggle('blank',t.value.trim()==='');
    t.classList.toggle('over',over);t.title=over?'Higher than the out-of value ('+cf.outOf+')':'';
  }
  if(t.dataset&&t.dataset.cm&&t.tagName==='TEXTAREA'){
    const c=cls();c.comments=c.comments||{};
    const cm=c.comments[t.dataset.cm]||(c.comments[t.dataset.cm]={text:'',unit:'',band:-1,opt:-1});
    cm.text=t.value;sizeTa(t);
    const pt=t.parentNode.querySelector('.ptext');if(pt)pt.textContent=t.value;
    markDirty();return;
  }
  if(t.dataset&&t.dataset.note!==undefined&&t.tagName==='TEXTAREA'){
    if(t.dataset.note==='class')cls().notes=t.value;
    else{const s=S(t.dataset.note);if(s)s.notes=t.value}
    markDirty();
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('mk'))return;
  let dr=0;
  if(e.key==='Enter'||e.key==='ArrowDown')dr=1;else if(e.key==='ArrowUp')dr=-1;else return;
  e.preventDefault();
  const tbl=t.closest('table');
  const next=tbl.querySelector('.mk[data-row="'+(+t.dataset.row+dr)+'"][data-col="'+t.dataset.col+'"]');
  if(next){next.focus();next.select()}else t.blur();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t||(t.id!=='stuList'&&t.id!=='asList'))return;
  if($('#modal').classList.contains('open'))return;
  let d=0;
  if(e.key==='ArrowDown')d=1;else if(e.key==='ArrowUp')d=-1;else if(e.key==='Home')d=-1e9;else if(e.key==='End')d=1e9;else return;
  e.preventDefault();
  const isStu=t.id==='stuList';
  const ids=isStu?sorted().map(x=>x.id):cls().assessments.map(x=>x.id);
  if(!ids.length)return;
  const cur=ids.indexOf(isStu?selStu:selAss);
  let i=cur<0?(d>0?0:ids.length-1):Math.max(0,Math.min(ids.length-1,cur+d));
  if(isStu){selStu=ids[i];view={type:'student'}}else{selAss=ids[i];view={type:'assess'}}
  renderSide();renderMain();
});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}});

/* ================= Boot ================= */
(async function init(){
  try{const t=localStorage.getItem(LS);if(t)db=JSON.parse(t)}catch(e){}
  if(!db||!Array.isArray(db.classes)||!db.classes.length)db=blankDb();
  let cur=null;try{cur=localStorage.getItem(LSCUR)}catch(e){}
  db.currentClass=db.classes.some(c=>c.id===cur)?cur:(db.classes.some(c=>c.id===db.currentClass)?db.currentClass:db.classes[0].id);
  ensureActive();renderAll();setStatus('local');
  if(!canFolder)return;
  let h=null;try{h=await idbGet('dir')}catch(e){}
  if(!h)return;
  dirHandle=h;
  try{
    const p=await h.queryPermission({mode:'readwrite'});
    if(p==='granted')await loadFolder(false);
    else{setStatus('needperm');showLock()}
  }catch(e){console.error(e);dirHandle=null;setStatus('local')}
})();
})();
</script>
